name: CI

# Build, test and lint on every push/PR against main. Publishing the installable release assets is
# release.yml; scripts/install.ps1 downloads those assets, so a green CI here means "the code and the
# installer scripts are sound", not "a release exists".
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The installer is fetched over the network and piped straight into a shell, so it gets no second
  # chance: whatever ships is what runs on someone's machine. Static analysis is the only gate it has
  # — a real end-to-end install needs a published release to download from.
  scripts:
    name: Lint install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A script that does not parse never reaches PSScriptAnalyzer's Error/Warning severities: a syntax
      # error is reported as ParseError, and filtering it out is how a broken installer shipped. The parser
      # runs first, on the exact text a user pipes into `iex`.
      - name: Parse the install scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in 'scripts/install.ps1', 'install.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              Write-Host "::error file=$script,line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'Install scripts parse.'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Analyzed one file at a time: -Path takes a single path on Windows PowerShell hosts.
          # ParseError is named explicitly for the same reason the step above exists: it is a severity of
          # its own, and leaving it out is how a script that cannot run once passed a lint gate.
          $issues = @()
          foreach ($script in 'scripts/install.ps1', 'install.ps1') {
            $issues += Invoke-ScriptAnalyzer -Path $script -Severity Error, Warning, ParseError
          }
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::error::PSScriptAnalyzer reported $($issues.Count) issue(s)"
            exit 1
          }
          Write-Host 'Install scripts are clean.'

  # Two configurations, both on purpose. Release is the combat one - release.yml tests a tag with it, and the
  # installer ships what it builds - while the work itself happens in Debug, where the `#if DEBUG` branches
  # live. A spec that holds on Debug-only behaviour is green locally and red here, which is how v0.19.0 went
  # out red: two specs paired with a seeded code that Release does not seed (TASK-350). Running both is what
  # stops that from depending on anyone remembering (TASK-351).
  build-test:
    name: Build & test (windows, ${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Both configurations report: one failing must not hide whether the other did.
      fail-fast: false
      matrix:
        configuration: [ Release, Debug ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # global.json pins the 10.0.4xx feature band, so the SDK must come from setup-dotnet rather
      # than from whatever the image happens to ship.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aiko.slnx

      - name: Build (${{ matrix.configuration }})
        run: dotnet build Aiko.slnx -c ${{ matrix.configuration }} --no-restore

      # The MCP suite boots its own daemon on a random port with an isolated database, so no manual
      # orchestration is needed here.
      - name: Test (${{ matrix.configuration }})
        run: dotnet test Aiko.slnx -c ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=test-results-${{ matrix.configuration }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.configuration }}
          path: '**/*.trx'
          if-no-files-found: ignore
