name: CodeQL

# Static security analysis for the C# codebase. Runs on windows-latest because that is the platform
# the product targets and the one where the solution (including the Blazor WASM PWA) is built and
# tested in CI.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 3 * * 1'   # weekly, Monday 03:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # upload results to the Security tab

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: csharp
          build-mode: manual

      # Explicit build so CodeQL sees every project, target framework and generated Razor source.
      - name: Build
        run: dotnet build Aiko.slnx -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:csharp"
